            description: 储存多余的物品，直到储满。优先处理左边的输出，并可以用作溢出门。
    wire_tunnel:
        default:
            name: 交叉电线
            description: 使两根<strong>电线</strong>交叉而不会连接起来。
    constant_signal:
        default:
            name: 恒定信号
            description: 发出固定信号，可以是<strong>图形</strong>、<strong>颜色</strong>、<strong>开关值（1 /
                0）</strong>。
    lever:
        default:
            name: 开关
            description: 可以在电线层上发出<strong>开关值（1 / 0）</strong>信号，以达到控制部件的作用，比如可以用来控制物品过滤器。
    logic_gate:
        default:
            name: 与门
            description: 如果输入<strong>都是</strong>正信号，则发出<strong>开（1）</strong>信号。（正信号：图形，颜色，开（1）信号）
        not:
            name: 非门
            description: 如果输入<strong>不是</strong>正信号，则发出<strong>开（1）</strong>信号。（正信号：图形，颜色，开（1）信号）
        xor:
            name: 异或门
            description: 如果输入<strong>只有一个</strong>正信号，则发出<strong>开（1）</strong>信号。（正信号：图形，颜色，开（1）信号）
        or:
            name: 或门
            description: 如果输入<strong>有一个</strong>是正信号，则发出<strong>开（1）</strong>信号。（正信号：图形，颜色，开（1）信号）
    transistor:
        default:
            name: 晶体管
            description: 如果侧边输入正信号，输入可以通过并转发。（正信号：图形，颜色，开（1）信号）
        mirrored:
            name: 晶体管
            description: 如果侧边输入正信号，输入可以通过并转发。（正信号：图形，颜色，开（1）信号）
    filter:
        default:
            name: 过滤器
            description: 在顶侧输出和<strong>信号</strong>匹配的内容，在右侧输出不匹配的内容。如果是开关量的话，开（1）信号从顶侧输出，关（0）信号从右侧输出。
    display:
        default:
            name: 显示器
            description: 在显示器上显示连接的<strong>信号</strong>（信号可以是：图形、颜色、开关值）。
    reader:
        default:
            name: 传送带读取器
            description: 可以读取<strong>传送带</strong>平均<strong>吞吐量</strong>。输出最后在<strong>电线层</strong>上读取的物品（一旦解锁。）
    analyzer:
        default:
            name: 图形分析器
            description: 分析<strong>图形</strong>最底层的右上象限并返回其<strong>图形</strong>和<strong>颜色</strong>。
    comparator:
        default:
            name: 比较器
            description: 如果输入的两个<strong>信号</strong>一样将输出开（1）信号，可以比较图形，颜色，和开关值。
    virtual_processor:
        default:
            name: 模拟切割机
            description: 模拟将<strong>图形</strong>切割成两半。
        rotator:
            name: 模拟旋转机
            description: 模拟顺时针旋转<strong>图形</strong>。
        unstacker:
            name: 模拟拆分器
            description: 模拟提取最上层<strong>图形</strong>从右侧输出，提取其余的<strong>图形</strong>从左侧输出。
        stacker:
            name: 模拟堆叠机
            description: 模拟将右侧<strong>图形</strong>叠在左侧<strong>图形</strong>上。
        painter:
            name: 模拟上色器
            description: 模拟使用右侧输入的<strong>颜色</strong>给底部输入的<strong>图形</strong>上色
storyRewards:
    reward_cutter_and_trash:
        title: 切割图形
        desc: 恭喜！您解锁了<strong>切割机</strong>，不管如何放置，它只会从上到下切开<strong>图形</strong>！
            <br>注意一定要用处理掉切割后废弃的<strong>图形</strong>，不然它会<strong>阻塞</strong>传送带，
            <br>使用<strong>垃圾桶</strong>，它会清除所有放进去的图形！
    reward_rotator:
        title: 旋转
        desc: 恭喜！您解锁了<strong>旋转机</strong>。它会顺时针将输入的<strong>图形旋转90度</strong>。
    reward_painter:
        title: 上色
        desc: 恭喜！您解锁了<strong>上色器</strong>。开采一些颜色（就像您开采图形一样），将其在上色器中与图形结合来将图形上色！
            <br>注意：如果您不幸患有色盲，可以在设置中启用<strong>色盲模式</strong>
    reward_mixer:
        title: 混合颜色
        desc: 恭喜！您解锁了<strong>混色器</strong>。它使用<strong>叠加混色法</strong>将两种颜色混合起来。
    reward_stacker:
        title: 堆叠
        desc: 恭喜！您解锁了<strong>堆叠机</strong>。它会将将输入的<strong>图形</strong>在同一层内组合在一起。
            <br>如果不能被直接组合，则右边输入<strong>图形</strong>会堆叠在左边输入<strong>图形</strong>上面。
    reward_splitter:
        title: 分离器（小型）
        desc: 您已经解锁了<strong>平衡器</strong>的变体<strong>分离器</strong>，它会把输入的东西一分为二！
    reward_tunnel:
        title: 隧道
        desc: 恭喜！您解锁了<strong>隧道</strong>。它可放置在<strong>传送带</strong>或<strong>设施</strong>下方以运送物品。
    reward_rotator_ccw:
        title: 逆时针旋转
        desc: 恭喜！您解锁了<strong>旋转机</strong>的<strong>逆时针</strong>变体。它可以逆时针旋转<strong>图形</strong>。
            <br>选择<strong>旋转机</strong>然后按 "T" 键来选取这个变体。
    reward_miner_chainable:
        title: 链式开采器
        desc: 您已经解锁了<strong>链式开采器</strong>！它能<strong>转发资源</strong>给其他的开采器，这样您就能更有效率的开采各类资源了！<br><br>
            注意：新的开采器已替换了工具栏里旧的开采器！
    reward_underground_belt_tier_2:
        title: 二级隧道
        desc: 恭喜！您解锁了<strong>二级隧道</strong>。这是隧道的一个变体。二级隧道有<strong>更长的传输距离</strong>。您还可以混用不同的隧道变体！
    reward_cutter_quad:
        title: 四向切割机
        desc: 恭喜！您解锁了<strong>切割机</strong>的<strong>四向</strong>变体。它可以将输入的<strong>图形</strong>切成四块而不只是左右两块！
    reward_painter_double:
        title: 双面上色器
        desc: 恭喜！您解锁了<strong>上色器</strong>的<strong>双面</strong>变体。它可以同时为两个图形上色，但每次只消耗一份颜色！
    reward_storage:
        title: 存储器
        desc: 您已经解锁了<strong>存储器</strong>，它能存满指定容量的物品！
            <br>它<strong>优先从左边</strong>输出，这样您就可以用它做一个<strong>溢流门</strong>了！
    reward_freeplay:
        title: 自由模式
        desc: 成功了！您解锁了<strong>自由模式</strong>！挑战升级！这意味着现在将<strong>随机</strong>生成图形！
            从现在起，中心基地最为需要的是<strong>产量</strong>，强烈建议您去制造一台能够自动交付所需图形的机器！<br><br>
            基地会在<strong>电线层</strong>输出需要的图形，您需要去分析图形并在此基础上自动配置您的工厂。
    reward_blueprints:
        title: 蓝图
        desc: 您现在可以<strong>复制粘贴</strong>您的工厂的一部分了！按住 CTRL 键并拖动鼠标来选择一块区域，然后按 C 键复制。
            <br><br>粘贴并<strong>不是免费的</strong>，您需要制造<strong>蓝图图形</strong>来负担。蓝图图形是您刚刚交付的图形。
    no_reward:
        title: 下一关
        desc: 这一关没有奖励，但是下一关有！<br><br>
            注意：最高明的规划师都不会破坏原有的工厂设施，您生产过的<strong>所有图形</strong>都会被用于<strong>解锁升级</strong>。
    no_reward_freeplay:
        title: 下一关
        desc: 恭喜您！
    reward_balancer:
        title: 平衡器
        desc: 恭喜！您解锁了多功能<strong>平衡器</strong>，它能够<strong>分割和合并</strong>多个传送带的资源，可以用来建造更大的工厂！
    reward_merger:
        title: 合并器（小型）
        desc: 恭喜！您解锁了<strong>平衡器</strong>的变体<strong>合并器</strong>，它能合并两个输入到同一个传送带上！
    reward_belt_reader:
        title: 传送带读取器
        desc: 恭喜！您解锁了<strong>传送带读取器</strong>！它能够测量传送带上的生产率。
            <br><br>等您解锁了<strong>电线层</strong>后，它将会极其有用！
    reward_rotator_180:
        title: 旋转机（180度）
        desc: 恭喜！您解锁了<strong>旋转器（180度）</strong>！它能帮您把一个图形旋转 180 度（惊不惊喜！:D）
    reward_display:
        title: 显示器
        desc: 恭喜！您已经解锁了<strong>显示器</strong>，它可以显示一个在<strong>电线层上连接的信号</strong>！
            <br>注意：您注意到<strong>传送读取器</strong>和<strong>存储器</strong>输出的他们最后读取的物品了吗？试着在显示屏上展示一下！
    reward_constant_signal:
        title: 恒定信号
        desc: 恭喜！您解锁了生成于电线层之上的<strong>恒定信号</strong>，把它连接到<strong>过滤器</strong>时非常有用。
            <br>比如，它能发出图形、颜色、开关值（1 / 0）的固定信号。
    reward_logic_gates:
        title: 逻辑门
        desc: 您解锁了<strong>逻辑门</strong>！它们是个好东西！<br>
            您可以用它们来进行'与，或，非，异或'操作。<br><br>作为奖励，我还给您解锁了<strong>晶体管</strong>！
    reward_virtual_processing:
        title: 模拟处理器
        desc: 我刚刚给了一大堆新设施，让您可以<strong>模拟形状的处理过程</strong>！<br>
            您现在可以在电线层上模拟切割机，旋转机，堆叠机和其他机器！<br> 有了这些，您可以选择下面三个方向来继续游戏：<br>
            -建立一个<strong>自动化机器</strong>以生产出任何中心基地需要图形（建议一试！）。<br>
            -用<strong>电线层</strong>做些酷炫的东西。<br> -继续正常游戏。<br> 放飞想象，尽情创造！
    reward_wires_painter_and_levers:
        title: 电线 & 四口上色器
        desc: 恭喜！您解锁了<strong>电线层</strong>：它是正常层之上的一个层，它将带来了许多新的机制！<br><br>
            首先我解锁了您的<strong>四口上色器</strong>，按<strong>E</strong>键切换到电线层，然后连接您想要染色的槽，用开关来控制开启。<br><br>
            <strong>提示</strong>：可在设置中打开电线层教程！
    reward_filter:
        title: 物品过滤器
        desc: 恭喜！您解锁了<strong>物品过滤器</strong>！它会根据在电线层上输入的信号决定是从上面还是右边输出物品。<br><br>
            您也可以输入开关值（1 / 0）信号来激活或者禁用它。
    reward_demo_end:
        title: 试玩结束
        desc: 恭喜！您已经通关了试玩版本！<br>更多挑战，请至 Steam 商城购买完整版！谢谢支持！
    reward_research:
        title: Research
        desc: You have unlocked the <strong>Research</strong> section of the Upgrades
            window! Spend the shapes you deliver to the Hub on optional building
            variants there, instead of waiting for them to show up in the level
            ladder.
    reward_research_t2:
        title: Research Tier II
        desc: <strong>Research Tier II</strong> is now available - more building
            variants can be researched in the Upgrades window!
    reward_shop_auto_tunnel:
        title: Auto-Tunneling
        desc: Purchased in the <strong>Shop</strong> - dragging a belt across a gap now
            automatically tunnels under it!
    reward_shop_overview_building:
        title: Overview Building
        desc: Purchased in the <strong>Shop</strong> - you can now place buildings while
            the map is zoomed out to overview mode!
    reward_shop_auto_merger:
        title: Auto-Merging
        desc: Purchased in the <strong>Shop</strong> - dragging a belt into an existing
            belt run now automatically inserts a merger!
    reward_shop_auto_splitter:
        title: Auto-Splitting
        desc: Purchased in the <strong>Shop</strong> - starting a new belt from an
            existing belt run now automatically inserts a splitter!
    reward_shop_long_route:
        title: Long-Distance Routing
        desc: Purchased in the <strong>Shop</strong> - belts dragged across obstacles
            can now bend around much longer detours!
    reward_shop_exchange:
        title: Exchange
        desc: Purchased in the <strong>Shop</strong> - you can now trade shapes for
            currency and currency for shapes!
settings:
    title: 设置
    categories:
        general: 通用
        userInterface: 用户界面
        advanced: 高级
        performance: 性能
    versionBadges:
        dev: 开发版本
        staging: 预览版本
        prod: 正式版本
    buildDate: 于 <at-date> 编译
    labels:
        uiScale:
            title: 用户界面大小
            description: 改变用户界面大小。用户界面会随着屏幕分辨率缩放，这个设置决定缩放比例。
            scales:
                super_small: 最小
                small: 较小
                regular: 正常
                large: 较大
                huge: 最大
        scrollWheelSensitivity:
            title: 缩放灵敏度
            description: 改变屏幕缩放灵敏度（用鼠标滚轮或者触控板控制缩放）。
            sensitivity:
                super_slow: 最低
                slow: 较低
                regular: 正常
                fast: 较高
                super_fast: 最高
        language:
            title: 语言
            description: 更改语言。所有的翻译都由社区提供，欢迎玩家继续提供意见！
        fullscreen:
            title: 全屏
            description: 全屏可获得更好的游戏体验。仅在完整版中可用。
        soundsMuted:
            title: 关闭音效
            description: 关闭所有音效。
        musicMuted:
            title: 关闭音乐
            description: 关闭所有音乐。
        theme:
            title: 界面主题
            description: 选择界面主题（深色或浅色）。
            themes:
                dark: 深色
                light: 浅色
        refreshRate:
            title: 模拟频率、刷新频率
            description: 在这里更改刷新频率，这样游戏可以正确地根据您的屏幕进行模拟。但是如果您的电脑性能不佳，提高刷新频率可能降低帧数。注意，60Hz
                以上的任何频率都会导致游戏卡顿！
        alwaysMultiplace:
            title: 多重放置
            description: 开启这个选项之后放下设施将不会取消设施选择。等同于一直按下 SHIFT 键。
        offerHints:
            title: 提示与教程
            description: 是否显示提示、教程以及一些其他的帮助理解游戏的 UI 元素。建议新手玩家开启。
        movementSpeed:
            title: 移动速度
            description: 改变摄像头的移动速度。
            speeds:
                super_slow: 最慢
                slow: 较慢
                regular: 正常
                fast: 较快
                super_fast: 非常快
                extremely_fast: 最快
        enableTunnelSmartplace:
            title: 智能隧道放置
            description: 启用后，放置隧道时会将多余的传送带移除。此外，拖动隧道可以快速铺设隧道，以及移除不必要的隧道。
        vignette:
            title: 晕映
            description: 启用晕映功能，可将屏幕角落里的颜色变深，更容易阅读文本。
        autosaveInterval:
            title: 自动存档间隔
            description: 在这里控制您的游戏多长时间自动存档一次，你也可以完全关闭这个功能。建议打开。
            intervals:
                one_minute: 1 分钟
                two_minutes: 2 分钟
                five_minutes: 5 分钟
                ten_minutes: 10 分钟
                twenty_minutes: 20 分钟
                disabled: 关闭
        compactBuildingInfo:
            title: 精简设施信息
            description: 缩小设施信息展示框。如果打开，放置设施时将不再显示说明和图片，只显示建造速度或其他数据。
        disableCutDeleteWarnings:
            title: 关闭剪切/删除警告
            description: 如果打开，将不再在剪切或者删除 100+ 实体时显示警告信息。
        enableColorBlindHelper:
            title: 色盲模式
            description: 提供多种工具，帮助色盲玩家可正常进行游戏。
        rotationByBuilding:
            title: 记忆设施方向
            description: 每一类设施都会记住各自上一次的旋转方向。如果您经常在不同设施类型之间切换，这个设置会让游戏操控更加便捷。
        soundVolume:
            title: 音效音量
            description: 设置音效的音量
        musicVolume:
            title: 音乐音量
            description: 设置音乐的音量
        lowQualityMapResources:
            title: 低质量地图资源
            description: 放大时简化地图上资源的渲染以提高性能。开启甚至会让画面看起来更干净，低配置电脑玩家建议开启！
        disableTileGrid:
            title: 禁用网格
            description: 禁用平铺网格有助于提高性能。这也让游戏画面看起来更干净！
        clearCursorOnDeleteWhilePlacing:
            title: 右键取消
            description: 默认启用。在选择要放置的设施时，单击鼠标右键即可取消。如果禁用，则可以通过在放置设施时单击鼠标右键来删除设施。
        lowQualityTextures:
            title: 低质量纹理（丑陋）
            description: 使用低质量纹理提高游戏性能。但是这样游戏会看起来很丑！
        displayChunkBorders:
            title: 显示大块的边框
            description: 游戏将每一个大块分成 16*16 的小块，如果启用将会显示每个大块的边框。
        pickMinerOnPatch:
            title: 在资源块上选择开采器
            description: 默认开启，当在资源块上使用选取器时会选择开采器。
        simplifiedBelts:
            title: 简单的传送带（简陋）
            description: 除非鼠标放在传送带上，不然不会渲染传送带上的物品。启用可提升游戏性能。但除非特别需要性能，否则不推荐启用。
        enableMousePan:
            title: 鼠标平移屏幕
            description: 在鼠标滑到屏幕边缘时可以移动地图。移动速度取决于移动速度设置。
        zoomToCursor:
            title: 鼠标位置缩放
            description: 启用后在鼠标所在位置进行屏幕缩放，否则在屏幕中间进行缩放。
        mapResourcesScale:
            title: 地图资源图形尺寸
            description: 控制地图总览时图形的尺寸（指缩小视野时）。
        shapeTooltipAlwaysOn:
            title: 图形工具提示-始终显示
            description: 在设施上悬停时是否始终显示图形工具提示， 而不是必须按住 “Alt” 键。
        alwaysShowBuildingInfo:
            title: Always Show Building Info
            description: On mobile (no keyboard/hotkey to toggle it), shows the selected
                building's info panel automatically. Turn off to keep it hidden.
    rangeSliderPercentage: <amount>%
    tickrateHz: <amount> 赫兹
    newBadge: 新的！
keybindings:
    title: 按键设定
    hint: 提示：使用 CTRL、SHIFT、ALT！这些键在放置设施时有不同的效果。
    resetKeybindings: 重置按键设定
    categoryLabels:
        general: 通用
        ingame: 游戏
        navigation: 视角
        placement: 放置
        massSelect: 批量选择
        buildings: 设施快捷键
        placementModifiers: 放置设施修饰键
        mods: 由游戏模组（Mods）提供
    mappings:
