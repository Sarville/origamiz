        creationSuccessNotification: Markierung wurde erstellt.
        descriptionMobile: Tap a marker to jump to it, or hold it to edit. Its edit icon
            in the list also lets you rename or delete it.<br><br>Tap the marker
            button below to create one at the current view.
    shapeViewer:
        title: Ebenen
        empty: Leer
        copyKey: Schlüssel kopieren
        pin: Pin
        unpin: Unpin
    interactiveTutorial:
        title: Einführung
        hints:
            1_1_extractor: Platziere einen <strong>Extraktor</strong> auf der
                <strong>Kreisform</strong>, um sie zu extrahieren!
            1_2_conveyor: "Verbinde den Extraktor mit einem <strong>Fließband</strong> und
                schließe ihn am Hub an!<br><br>Tipp: <strong>Drücke und
                ziehe</strong> das Fließband mit der Maus!"
            1_3_expand: "Dies ist <strong>KEIN</strong> Idle-Game! Baue mehr Extraktoren und
                Fließbänder, um das Ziel schneller zu erreichen.<br><br>Tipp:
                Halte <strong>UMSCH</strong>, um mehrere Gebäude zu platzieren
                und nutze <strong>R</strong>, um sie zu rotieren."
            2_1_place_cutter: "Platziere nun einen <strong>Schneider</strong>, um die Kreise
                zu halbieren.<br><br> Übrigens: Der Schneider teilt Items immer
                von <strong>oben nach unten</strong>, unabhängig von seiner
                Orientierung!"
            2_2_place_trash: Der Schneider kann <strong>verstopfen</strong>!<br><br>Benutze
                einen <strong>Mülleimer</strong> um den aktuell (!) nicht
                benötigten Rest loszuwerden.
            2_3_more_cutters: "Gut gemacht! Platziere noch <strong>zwei andere
                Schneider</strong> um das Ganze zu beschleunigen.<br><br>
                Übrigens: Benutze die <strong>Hotkeys 0-9</strong> um Gebäude
                schneller auszuwählen!"
            3_1_rectangles: "Lass uns ein paar Quadrate extrahieren! <strong>Baue vier
                Extraktoren</strong> und verbinde sie mit deinem Hub.<br><br>
                PS: Halte <strong>SHIFT</strong>, während du ein Fließband
                ziehst, um den Fließbandplaner zu aktivieren!"
            21_1_place_quad_painter: Platziere den <strong>vierfachen Färber</strong> und
                organisiere ein paar <strong>Kreise</strong>, sowie
                <strong>weiße</strong> und <strong>rote</strong> Farbe!
            21_2_switch_to_wires: Wechsle in die Wires-Ebene, indem du <strong>E</strong>
                drückst!<br><br> Verbinde danach <strong>alle vier
                Eingänge</strong> mit Signalkabeln!
            21_3_place_button: Perfekt! Platziere jetzt einen <strong>Schalter</strong> und
                verbinde ihn mit Signalkabeln.
            21_4_press_button: "Drücke den Schalter, damit er ein <strong>wahres
                Signal</strong> ausgibt und den Färber aktiviert.<br><br> PS: Du
                musst nicht alle Eingänge verbinden! Probiere es auch mal mit
                zwei."
            1_2_hold_and_drag: Drücke und ziehe
        mobileHints:
            1_1_extractor: Choose an <strong>extractor</strong> in the toolbar, tap a
                <strong>circle shape</strong>, then tap <strong>confirm</strong>
                to extract it!
            1_2_conveyor: "Connect the extractor to your hub with a <strong>conveyor
                belt</strong>!<br><br>Tip: <strong>Touch, hold and drag</strong>
                to place a belt path."
            1_3_expand: "This is <strong>NOT</strong> an idle game! Build more extractors
                and belts to finish the goal quicker.<br><br>Tip: Choose a
                building in the toolbar, tap the map, then tap
                <strong>confirm</strong>. Use the <strong>rotate</strong> button
                to turn it."
            2_1_place_cutter: "Now place a <strong>Cutter</strong> to cut the circles in two
                halves!<br><br>Tip: The cutter always cuts from <strong>top to
                bottom</strong> regardless of its orientation."
            2_2_place_trash: The cutter can <strong>clog and stall</strong>!<br><br>Use a
                <strong>trash</strong> to get rid of the currently (!) not
                needed waste.
            2_3_more_cutters: "Good job! Now place <strong>2 more cutters</strong> to speed
                up this slow process!<br><br>Tip: Select buildings from the
                bottom toolbar."
            3_1_rectangles: "Now let's extract some rectangles! <strong>Build 3
                extractors</strong> and connect them to the hub.<br><br>Tip:
                <strong>Touch, hold and drag</strong> to lay a belt path."
            21_1_place_quad_painter: Place the <strong>quad painter</strong> and get some
                <strong>circles</strong>, <strong>white</strong> and
                <strong>red</strong> color!
            21_2_switch_to_wires: Tap the <strong>wires-layer button</strong> above the
                toolbar!<br><br>Then <strong>connect all four inputs</strong> of
                the painter with cables.
            21_3_place_button: Awesome! Now place a <strong>Switch</strong> and connect it
                with wires!
            21_4_press_button: "Tap the switch to make it <strong>emit a truthy
                signal</strong> and activate the painter.<br><br>Tip: You don't
                have to connect all inputs! Try wiring only two."
            1_2_hold_and_drag: Touch, hold and drag
