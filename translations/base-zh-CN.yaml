    massCutConfirm:
        title: 确认剪切
        desc: 您将要剪切很多设施，准确来说有 <count> 种！您确定要这么做吗？
    exportScreenshotWarning:
        title: 工厂截图
        desc: 您将要导出您整个工厂基地的截图。如果您已经建设了一个规模很大的基地，生成截图的过程将会很慢，且有可能导致游戏崩溃！
    massCutInsufficientConfirm:
