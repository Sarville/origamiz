        lowQualityMapResources:
            title: איכות ירודה של מאגרים
            description: .מפשט את הרנדור של המשאבים על המפה מתי שמסתכלים מקרוב בשביל לשפר את
                הביצועים !זה אפילו נראה נקי יותר, אז תנסה את זה
        disableTileGrid:
            title: הסתר את רשת
