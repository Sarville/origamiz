        copyKey: Копировать
        pin: Закрепить
        unpin: Открепить
    interactiveTutorial:
        title: Обучение
        hints:
            1_1_extractor: Поместите <strong>экстрактор</strong> на <strong>фигуру в форме
                круга</strong>, чтобы добыть её!
            1_2_conveyor: "Соедините экстрактор <strong>конвейером</strong> с хабом!<br><br>
                Подсказка: Необходимо выбрать конвейер и <strong>нажать и
                потащить</strong> мышку!"
            1_3_expand: "Это <strong>НЕ</strong> idle-игра! Постройте больше экстракторов и
                конвейеров, чтобы достичь цели быстрее.<br><br> Подсказка:
                Удерживайте <strong>SHIFT</strong>, чтобы разместить несколько
                экстракторов или <strong>R</strong>, чтобы вращать их."
            2_1_place_cutter: "Разместите <strong>резак</strong> для разрезания кругов на
                две половины!<br><br> Подсказка: резак всегда разрезает
                <strong>сверху вниз</strong> независимо от ориентации."
            2_2_place_trash: Резак может <strong>засориться и остановиться</strong>!<br><br>
                Используйте <strong>мусорку</strong>, чтобы избавиться от
                ненужных в данный момент (!) частей.
            2_3_more_cutters: "Хорошая работа! Теперь разместите <strong>ещё 2
                резака</strong>, чтобы ускорить этот медленный процесс!<br><br>
                Подсказка: Используйте <strong>клавиши 0-9</strong> для быстрого
                доступа к постройкам!"
            3_1_rectangles: "Теперь давайте извлечём немного прямоугольников!
                <strong>Постройте 3 экстрактора</strong>и соедините их с
                хабом.<br><br> Подсказка: Удерживайте <strong>SHIFT</strong>
                после выбора конвейера для активации планировщика конвейеров!"
            21_1_place_quad_painter: Разместите <strong>покрасчик для 4 предметов</strong> и
                получите <strong>круги</strong>, <strong>белого</strong> и
                <strong>красного</strong> цветов!
            21_2_switch_to_wires: Переключите слой проводов нажатием клавиши
                <strong>E</strong>!<br><br> Потом <strong>соедините все
                входы</strong> покрасчика кабелями!
            21_3_place_button: Отлично! Теперь разместите <strong>переключатель</strong> и
                присоедините его проводами!
            21_4_press_button: "Нажмите на переключатель, чтобы заставить его
                <strong>выдавать истинный сигнал</strong> и активировать
                покрасчик.<br><br> Подсказка: Не обязательно соединять все
                входы! Достаточно двух."
            1_2_hold_and_drag: Удерживайте и перетаскивайте
        mobileHints:
            1_1_extractor: "Выберите <strong>экстрактор</strong> на панели, коснитесь <strong>круглой фигуры</strong>, затем нажмите <strong>подтвердить</strong>, чтобы добывать её!"
            1_2_conveyor: "Соедините экстрактор с хабом <strong>конвейером</strong>!<br><br>Подсказка: <strong>коснитесь, удерживайте и ведите пальцем</strong>, чтобы проложить путь конвейера."
            1_3_expand: "Это <strong>НЕ</strong> idle-игра! Постройте больше экстракторов и конвейеров, чтобы достичь цели быстрее.<br><br>Подсказка: выберите постройку на панели, коснитесь поля, затем нажмите <strong>подтвердить</strong>. Для поворота используйте кнопку <strong>поворота</strong>."
            2_1_place_cutter: "Разместите <strong>резак</strong>, чтобы разрезать круги на две половины!<br><br>Подсказка: резак всегда режет <strong>сверху вниз</strong> независимо от ориентации."
            2_2_place_trash: "Резак может <strong>засориться и остановиться</strong>!<br><br>Используйте <strong>мусорку</strong>, чтобы избавиться от ненужных в данный момент (!) частей."
            2_3_more_cutters: "Хорошая работа! Теперь разместите <strong>ещё 2 резака</strong>, чтобы ускорить этот медленный процесс!<br><br>Подсказка: выбирайте постройки на нижней панели."
            3_1_rectangles: "Теперь давайте извлечём немного прямоугольников! <strong>Постройте 3 экстрактора</strong> и соедините их с хабом.<br><br>Подсказка: <strong>коснитесь, удерживайте и ведите пальцем</strong>, чтобы проложить путь конвейера."
            21_1_place_quad_painter: "Разместите <strong>покрасчик для 4 предметов</strong> и получите <strong>круги</strong>, <strong>белый</strong> и <strong>красный</strong> цвета!"
            21_2_switch_to_wires: "Нажмите кнопку <strong>слоя проводов</strong> над панелью!<br><br>Затем <strong>соедините все четыре входа</strong> покрасчика кабелями."
            21_3_place_button: "Отлично! Теперь разместите <strong>переключатель</strong> и соедините его проводами!"
            21_4_press_button: "Нажмите на переключатель, чтобы он <strong>выдавал истинный сигнал</strong> и активировал покрасчик.<br><br>Подсказка: не обязательно соединять все входы — попробуйте подключить только два."
            1_2_hold_and_drag: Коснитесь, удерживайте и ведите пальцем
