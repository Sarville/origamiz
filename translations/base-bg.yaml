        empty: Празно
        copyKey: Копирай код
        pin: Pin
        unpin: Unpin
    interactiveTutorial:
        title: Урок
        hints:
            1_1_extractor: Поставете <strong>екстрактор</strong> върху <strong>кръгла
                форма</strong>, за да я извлечете!
            1_2_conveyor: "Свържете екстрактора с <strong>конвейерна лента</strong> към
                вашата Централа!<br><br>Съвет: <strong>Щракнете и
                плъзнете</strong> лентата с мишката!"
            1_3_expand: "Това <strong>НЕ</strong> е idle игра! Постройте още екстрактори и
                ленти, за да изпълните целта по-бързо.<br><br>Съвет: Задръжте
                <strong>SHIFT</strong>, за да поставите няколко екстрактора, и
                използвайте <strong>R</strong>, за да ги завъртате."
            2_1_place_cutter: "Сега поставете <strong>резачка</strong>, за да разрежете
                кръговете на две половини!<br><br> PS: Резачката винаги реже
                <strong>отгоре надолу</strong>, независимо от ориентацията си."
            2_2_place_trash: Резачката може да <strong>се задръсти и спре</strong>!<br><br>
                Използвайте <strong>кошче</strong>, за да се отървете от в
                момента (!) ненужния отпадък.
            2_3_more_cutters: "Добра работа! Сега поставете <strong>още 2 резачки</strong>,
                за да ускорите този бавен процес!<br><br> PS: Използвайте
                <strong>бързите клавиши 0-9</strong>, за да достъпвате сгради
                по-бързо!"
            3_1_rectangles: "Сега да извлечем правоъгълници! <strong>Постройте 4
                екстрактора</strong> и ги свържете към Централата.<br><br> PS:
                Задръжте <strong>SHIFT</strong>, докато плъзгате лента, за да
                активирате планирането на ленти!"
            21_1_place_quad_painter: Поставете <strong>четворния бояджия</strong> и
                осигурете <strong>кръгове</strong>, <strong>бял</strong> и
                <strong>червен</strong> цвят!
            21_2_switch_to_wires: Превключете към слоя с проводници с
                <strong>E</strong>!<br><br> След това <strong>свържете и
                четирите входа</strong> на бояджията с кабели!
            21_3_place_button: Страхотно! Сега поставете <strong>превключвател</strong> и го
                свържете с проводници!
            21_4_press_button: "Натиснете превключвателя, за да <strong>излъчва ненулев
                сигнал</strong> и така да активира бояджията.<br><br> PS: Не е
                нужно да свързвате всички входове! Опитайте само два."
            1_2_hold_and_drag: Задръж и плъзни
        mobileHints:
            1_1_extractor: Choose an <strong>extractor</strong> in the toolbar, tap a
                <strong>circle shape</strong>, then tap <strong>confirm</strong>
                to extract it!
            1_2_conveyor: "Connect the extractor to your hub with a <strong>conveyor
                belt</strong>!<br><br>Tip: <strong>Touch, hold and drag</strong>
                to place a belt path."
            1_3_expand: "This is <strong>NOT</strong> an idle game! Build more extractors
                and belts to finish the goal quicker.<br><br>Tip: Choose a
                building in the toolbar, tap the map, then tap
                <strong>confirm</strong>. Use the <strong>rotate</strong> button
                to turn it."
            2_1_place_cutter: "Now place a <strong>Cutter</strong> to cut the circles in two
                halves!<br><br>Tip: The cutter always cuts from <strong>top to
                bottom</strong> regardless of its orientation."
            2_2_place_trash: The cutter can <strong>clog and stall</strong>!<br><br>Use a
                <strong>trash</strong> to get rid of the currently (!) not
                needed waste.
            2_3_more_cutters: "Good job! Now place <strong>2 more cutters</strong> to speed
                up this slow process!<br><br>Tip: Select buildings from the
                bottom toolbar."
            3_1_rectangles: "Now let's extract some rectangles! <strong>Build 3
                extractors</strong> and connect them to the hub.<br><br>Tip:
                <strong>Touch, hold and drag</strong> to lay a belt path."
            21_1_place_quad_painter: Place the <strong>quad painter</strong> and get some
                <strong>circles</strong>, <strong>white</strong> and
                <strong>red</strong> color!
            21_2_switch_to_wires: Tap the <strong>wires-layer button</strong> above the
                toolbar!<br><br>Then <strong>connect all four inputs</strong> of
                the painter with cables.
            21_3_place_button: Awesome! Now place a <strong>Switch</strong> and connect it
                with wires!
            21_4_press_button: "Tap the switch to make it <strong>emit a truthy
                signal</strong> and activate the painter.<br><br>Tip: You don't
                have to connect all inputs! Try wiring only two."
            1_2_hold_and_drag: Touch, hold and drag
