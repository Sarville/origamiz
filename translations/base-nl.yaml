shopUpgrades:
    belt:
        name: Lopende banden, Verdeler & Tunnels
        description: Snelheid x<currentMult> → x<newMult>
    miner:
        name: Ontginner
        description: Snelheid x<currentMult> → x<newMult>
    processors:
