shapeViewerTool:
    title: Просмотр фигур
    description: >-
        Создавайте, изучайте и копируйте короткие ключи фигур, не выходя из игры. Введите ключ для предпросмотра или сгенерируйте случайную фигуру как отправную точку.
    shortKey: Короткий ключ фигуры
    preview: Предпросмотр
    randomize: Случайная фигура
    copy: Копировать ключ
    useKey: Использовать этот ключ
    export: Экспорт PNG
    invalid: Введите корректный короткий ключ фигуры.
    instructions: >-
        <h2>Как записывать фигуры</h2>
        <p>Фигура задаётся <strong>коротким ключом</strong> и содержит до четырёх слоёв. В каждом слое четыре квадранта: запись начинается с <strong>верхнего правого</strong> и идёт по часовой стрелке.</p>
        <p>Квадрант — это пара символов: заглавная буква формы и строчная буква цвета. Для пустого квадранта используйте <code>--</code>. Слои отделяются <code>:</code>; первым указывается нижний слой.</p>
        <div class="legendGrid">
            <section><h3>Формы</h3><ul class="legendList"><li><code>C</code><span>— Круг</span></li><li><code>R</code><span>— Прямоугольник</span></li><li><code>W</code><span>— Ветряк</span></li><li><code>S</code><span>— Звезда</span></li></ul></section>
            <section><h3>Цвета</h3><ul class="legendList"><li><code>r</code><i class="colorDot red"></i><span>Красный</span></li><li><code>g</code><i class="colorDot green"></i><span>Зелёный</span></li><li><code>b</code><i class="colorDot blue"></i><span>Синий</span></li><li><code>y</code><i class="colorDot yellow"></i><span>Жёлтый</span></li><li><code>p</code><i class="colorDot purple"></i><span>Фиолетовый</span></li><li><code>c</code><i class="colorDot cyan"></i><span>Голубой</span></li><li><code>u</code><i class="colorDot uncolored"></i><span>Без цвета</span></li><li><code>w</code><i class="colorDot white"></i><span>Белый</span></li></ul></section>
        </div>
        <h3>Примеры</h3>
        <ul class="examples"><li><button type="button" class="exampleKey" data-key="CwCwCwCw"><code>CwCwCwCw</code><span>Белый круг</span></button></li><li><button type="button" class="exampleKey" data-key="----RuRu"><code>----RuRu</code><span>Половина прямоугольника</span></button></li><li><button type="button" class="exampleKey" data-key="CgScScCg"><code>CgScScCg</code><span>Смешанные круги и звёзды</span></button></li><li><button type="button" class="exampleKey" data-key="RpRpRpRp:CwCwCwCw"><code>RpRpRpRp:CwCwCwCw</code><span>Два наложенных слоя</span></button></li><li><button type="button" class="exampleKey" data-key="RwCu--Wu:----Rw--"><code>RwCu--Wu:----Rw--</code><span>Наш логотип</span></button></li></ul>
