    importSavegameError:
        title: Грешка при импортиране
        text: "Неуспешно импортиране на запазената игра:"
    importSavegameSuccess:
        title: Запазената игра е импортирана
        text: Вашата запазена игра беше импортирана успешно.
    gameLoadFailure:
        title: Играта е повредена
        text: "Неуспешно зареждане на запазената игра:"
    confirmSavegameDelete:
        title: Потвърди изтриването
        text: Сигурни ли сте, че искате да изтриете следната игра?<br><br>
            '<savegameName>' на ниво <savegameLevel><br><br> Това не може да
            бъде върнато!
        desc: Are you sure you want to delete this savegame?
        warningNote: This action cannot be undone.
    savegameDeletionError:
        title: Неуспешно изтриване
        text: "Неуспешно изтриване на запазената игра:"
    restartRequired:
        title: Изисква се рестарт
        text: Трябва да рестартирате играта, за да приложите настройките.
    editKeybinding:
        title: Промяна на клавишна комбинация
        desc: Натиснете клавиша или бутона на мишката, който искате да зададете, или ESC
            за отказ.
    resetKeybindingsConfirmation:
        title: Нулиране на клавишните комбинации
        desc: Това ще върне всички клавишни комбинации към стойностите по подразбиране.
            Моля, потвърдете.
    keybindingsResetOk:
        title: Клавишните комбинации са нулирани
        desc: Всички клавишни комбинации бяха върнати към стойностите по подразбиране!
    updateSummary:
        title: Нова актуализация!
        desc: "Ето промените от последното ви влизане:"
    upgradesIntroduction:
        title: Отключване на подобрения
        desc: Всички форми, които произвеждате, могат да се използват за отключване на
            подобрения - <strong>не унищожавайте старите си фабрики!</strong>
            Табът за подобрения е в горния десен ъгъл на екрана.
    massDeleteConfirm:
        title: Потвърди изтриването
        desc: Изтривате много сгради (точно <count>)! Сигурни ли сте, че искате да го
            направите?
    massCutConfirm:
        title: Потвърди изрязването
        desc: Изрязвате много сгради (точно <count>)! Сигурни ли сте, че искате да го
            направите?
    massCutInsufficientConfirm:
        title: Потвърди изрязването
        desc: Нямате достатъчно ресурси, за да поставите тази зона! Сигурни ли сте, че
            искате да я изрежете?
    blueprintsNotUnlocked:
        title: Още не е отключено
        desc: Завършете ниво 12, за да отключите чертежи!
    keybindingsIntroduction:
        title: Полезни клавишни комбинации
        desc: "Тази игра има много клавишни комбинации, които улесняват строенето на
            големи фабрики. Ето няколко, но непременно <strong>прегледайте
            клавишните комбинации</strong>!<br><br> <code
            class='keybinding'>CTRL</code> + Плъзгане: Избор на зона.<br> <code
            class='keybinding'>SHIFT</code>: Задръжте за поставяне на няколко
            еднакви сгради.<br> <code class='keybinding'>ALT</code>: Обръща
            посоката на поставяните ленти.<br>"
    createMarker:
        title: Нов маркер
        titleEdit: Редакция на маркер
        desc: Дайте му смислено име, можете също да добавите <strong>кратък код</strong>
            на форма (който може да генерирате <link>тук</link>)
    editSignal:
        title: Задаване на сигнал
        descItems: "Изберете предварително дефиниран елемент:"
        descShortKey: ... или въведете <strong>краткия код</strong> на форма (който може
            да генерирате <link>тук</link>)
    editConstantProducer:
        title: Задаване на елемент
    exportScreenshotWarning:
        title: Експорт на снимка
        desc: Поискахте да експортирате базата си като снимка. Имайте предвид, че това
            може да е доста бавно за голяма база и потенциално да срине играта!
    renameSavegame:
        title: Преименуване на запазена игра
        desc: Тук можете да преименувате запазената си игра.
    tutorialVideoAvailable:
        title: Наличен урок
        desc: За това ниво има налично видео с урок! Искате ли да го гледате?
    tutorialVideoAvailableForeignLanguage:
        title: Наличен урок
        desc: За това ниво има налично видео с урок, но е само на английски. Искате ли
            да го гледате?
    modsDifference:
        title: Предупреждение за модове
        desc: В момента инсталираните модове се различават от модовете, с които е
            създадена запазената игра. Това може да я повреди или изобщо да не
            се зареди. Сигурни ли сте, че искате да продължите?
        missingMods: Липсващи модове
        newMods: Новоинсталирани модове
    resourceLoadFailed:
        title: Ресурсите не се заредиха
        descSteamDemo: "Един или повече ресурси не можаха да бъдат заредени. Опитайте да
            рестартирате играта - ако това не помогне, опитайте преинсталация и
            проверка на файловете на играта чрез Steam. <br><br> Съобщение за
            грешка:"
