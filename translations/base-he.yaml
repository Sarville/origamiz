                אתה מחליף בין מבנים שונים הרבה פעמים
        compactBuildingInfo:
            title: אינפורמצית מבנים קומפקטית
            description: .מקצר את קופסת האינפורמציה של המבנים שיציג רק את המהירות שלו. אחרת
                הסבר ותמונה יופיעו
        disableCutDeleteWarnings:
