        mirrored:
            name: Бояджия
            description: Оцветява цялата форма от левия вход с цвета от долния вход.
        double:
            name: Бояджия (Двоен)
            description: Оцветява формите на левите входове с цвета от горния вход.
        quad:
            name: Бояджия (Четворен)
            description: Позволява ви да оцветявате всеки квадрант на формата поотделно. Ще
                бъдат оцветени само слотове с <strong>ненулев сигнал</strong> на
                слоя с проводници!
    trash:
        default:
            name: Кошче
            description: Приема входове от всички страни и ги унищожава. Завинаги.
    storage:
        default:
            name: Склад
            description: Съхранява излишните предмети до определен капацитет. Приоритизира
                левия изход и може да се използва като преливен клапан.
    wire:
        default:
            name: Проводник
            description: Пренася сигнали, които могат да бъдат предмети, цветове или булеви
                стойности (1 или 0). Проводници с различни цветове не се
                свързват.
        second:
            name: Проводник
            description: Пренася сигнали, които могат да бъдат предмети, цветове или булеви
                стойности (1 или 0). Проводници с различни цветове не се
                свързват.
    wire_tunnel:
        default:
            name: Пресичане на проводници
            description: Позволява два проводника да се пресекат, без да се свързват.
    constant_signal:
        default:
            name: Постоянен сигнал
            description: Излъчва постоянен сигнал, който може да бъде форма, цвят или булева
                стойност (1 или 0).
    lever:
        default:
            name: Превключвател
            description: Може да се превключва, за да излъчва булев сигнал (1 или 0) на слоя
                с проводници, който след това може да управлява компоненти,
                например филтър за предмети.
    logic_gate:
        default:
            name: AND врата
            description: Излъчва булева стойност "1", ако и двата входа са ненулеви.
                (Ненулево означава форма, цвят или булева стойност "1")
        not:
            name: NOT врата
            description: Излъчва булева стойност "1", ако входът не е ненулев. (Ненулево
                означава форма, цвят или булева стойност "1")
        xor:
            name: XOR врата
            description: Излъчва булева стойност "1", ако един от входовете е ненулев, но не
                и двата. (Ненулево означава форма, цвят или булева стойност "1")
        or:
            name: OR врата
            description: Излъчва булева стойност "1", ако един от входовете е ненулев.
                (Ненулево означава форма, цвят или булева стойност "1")
    transistor:
        default:
            name: Транзистор
            description: Пропуска долния вход, ако страничният вход е ненулев (форма, цвят
                или "1").
        mirrored:
            name: Транзистор
            description: Пропуска долния вход, ако страничният вход е ненулев (форма, цвят
                или "1").
    filter:
        default:
            name: Филтър
            description: Свържете сигнал, за да насочите всички съвпадащи предмети нагоре, а
                останалите надясно. Може да се управлява и с булеви сигнали.
    display:
        default:
            name: Дисплей
            description: Свържете сигнал, за да го покажете на дисплея - може да е форма,
                цвят или булева стойност.
    reader:
        default:
            name: Четец на лента
            description: Позволява измерване на средния поток на лента. Извежда последния
                прочетен предмет на слоя с проводници (след отключване).
    analyzer:
        default:
            name: Анализатор на форми
            description: Анализира горния десен квадрант на най-долния слой на формата и
                връща нейната форма и цвят.
    comparator:
        default:
            name: Компаратор
            description: Връща булева стойност "1", ако двата сигнала са напълно еднакви.
                Може да сравнява форми, цветове и булеви стойности.
    virtual_processor:
        default:
            name: Виртуална резачка
            description: Виртуално разрязва формата на две половини.
        rotator:
            name: Виртуален ротатор
            description: Виртуално завърта формата по часовниковата стрелка.
        unstacker:
            name: Виртуален разстакер
            description: Виртуално извлича най-горния слой към десния изход, а останалите
                към левия.
        stacker:
            name: Виртуален стакер
            description: Виртуално поставя дясната форма върху лявата.
        painter:
            name: Виртуален бояджия
            description: Виртуално оцветява формата от долния вход с цвета от десния вход.
storyRewards:
    reward_cutter_and_trash:
        title: Рязане на форми
        desc: Току-що отключихте <strong>резачката</strong>, която реже формите на две
            отгоре надолу <strong>независимо от ориентацията
            си</strong>!<br><br> Не забравяйте да премахвате отпадъка, иначе
            <strong>ще се задръсти и спре</strong> - за тази цел ви дадох
            <strong>кошче</strong>, което унищожава всичко, което поставите в
            него!
    reward_rotator:
        title: Въртене
        desc: <strong>Ротаторът</strong> е отключен! Той завърта формите по
            часовниковата стрелка с 90 градуса.
    reward_painter:
        title: Оцветяване
        desc: "<strong>Бояджията</strong> е отключен - извлечете цветни находища (точно
            както при формите) и ги комбинирайте с форма в бояджията, за да я
            оцветите!<br><br>PS: Ако сте далтонист, в настройките има
            <strong>режим за цветна слепота</strong>!"
    reward_mixer:
        title: Смесване на цветове
        desc: <strong>Смесителят</strong> е отключен - смесва два цвята чрез
            <strong>адитивно смесване</strong>!
    reward_stacker:
        title: Стакер
        desc: Вече можете да комбинирате форми със <strong>стакера</strong>! Двата входа
            се комбинират, и ако могат да се поставят един до друг, ще бъдат
            <strong>слети</strong>. Ако не, десният вход се <strong>поставя
            отгоре</strong> върху левия!
    reward_balancer:
        title: Балансер
        desc: Многофункционалният <strong>балансер</strong> е отключен - може да се
            използва за изграждане на по-големи фабрики чрез <strong>разделяне и
            сливане на предмети</strong> върху множество ленти!
    reward_tunnel:
        title: Тунел
        desc: <strong>Тунелът</strong> е отключен - вече можете да прекарвате предмети
            под ленти и сгради с него!
    reward_rotator_ccw:
        title: Завъртане обратно на часовника
        desc: Отключихте вариант на <strong>ротатора</strong> - позволява ви да
            завъртате форми обратно на часовниковата стрелка! За да го
            построите, изберете ротатора и <strong>натиснете 'T', за да сменяте
            вариантите му</strong>!
    reward_miner_chainable:
        title: Верижен екстрактор
        desc: "Отключихте <strong>верижния екстрактор</strong>! Той може да
            <strong>предава ресурсите си</strong> към други екстрактори, за да
            извличате по-ефективно ресурси!<br><br> PS: Старият екстрактор вече
            е заменен в лентата с инструменти!"
    reward_underground_belt_tier_2:
        title: Тунел Ниво II
        desc: Отключихте нов вариант на <strong>тунела</strong> - има <strong>по-голям
            обхват</strong>, а вече можете и да комбинирате тези тунели!
    reward_merger:
        title: Компактен сливач
        desc: Отключихте вариант <strong>сливач</strong> на <strong>балансера</strong> -
            приема два входа и ги слива в една лента!
    reward_splitter:
        title: Компактен разделител
        desc: Отключихте вариант <strong>разделител</strong> на
            <strong>балансера</strong> - приема един вход и го разделя на два!
    reward_belt_reader:
        title: Четец на лента
        desc: Вече отключихте <strong>четеца на лента</strong>! Той ви позволява да
            измервате потока на лента.<br><br>И изчакайте да отключите
            проводниците - тогава става наистина полезен!
    reward_cutter_quad:
        title: Четворна резачка
        desc: Отключихте вариант на <strong>резачката</strong> - позволява ви да режете
            формите на <strong>четири части</strong> вместо само на две!
    reward_painter_double:
        title: Двойно оцветяване
        desc: Отключихте вариант на <strong>бояджията</strong> - работи подобно на
            стандартния, но обработва <strong>две форми наведнъж</strong>, като
            използва само един цвят вместо два!
    reward_storage:
        title: Склад
        desc: Отключихте сградата <strong>склад</strong> - позволява ви да съхранявате
            предмети до определен капацитет!<br><br> Приоритизира левия изход,
            така че може да се използва и като <strong>преливен клапан</strong>!
    reward_blueprints:
        title: Чертежи
        desc: Вече можете да <strong>копирате и поставяте</strong> части от фабриката
            си! Изберете зона (задръжте CTRL и плъзнете с мишката) и натиснете
            'C', за да я копирате.<br><br>Поставянето <strong>не е
            безплатно</strong>, трябва да произвеждате <strong>форми за
            чертежи</strong>, за да си го позволите! (Тези, които току-що
            доставихте).
    reward_rotator_180:
        title: Ротатор (180°)
        desc: Току-що отключихте <strong>ротатор на 180 градуса</strong>! - Позволява ви
            да завъртате форма на 180 градуса (Изненада! :D)
    reward_wires_painter_and_levers:
        title: Проводници и четворен бояджия
        desc: "Току-що отключихте <strong>слоя с проводници</strong>: това е отделен
            слой над стандартния и въвежда много нови механики!<br><br> За
            начало ви отключих <strong>четворния бояджия</strong> - свържете
            слотовете, които искате да се боядисват, на слоя с
            проводници!<br><br> За да превключите към слоя с проводници,
            натиснете <strong>E</strong>. <br><br> PS: <strong>Включете
            подсказките</strong> в настройките, за да активирате урока за
            проводници!"
    reward_filter:
        title: Филтър за предмети
        desc: Отключихте <strong>филтъра за предмети</strong>! Той ще насочва предметите
            или към горния, или към десния изход според това дали съвпадат със
            сигнала от слоя с проводници.<br><br> Можете също да подадете булев
            сигнал (1 или 0), за да го активирате или деактивирате изцяло.
    reward_display:
        title: Дисплей
        desc: "Отключихте <strong>дисплея</strong> - свържете сигнал на слоя с
            проводници, за да го визуализирате!<br><br> PS: Забелязахте ли, че
            четецът на лента и складът извеждат последния прочетен предмет?
            Опитайте да го покажете на дисплей!"
    reward_constant_signal:
        title: Постоянен сигнал
        desc: Отключихте сградата <strong>постоянен сигнал</strong> на слоя с
            проводници! Това е полезно например за свързване към <strong>филтри
            за предмети</strong>.<br><br> Постоянният сигнал може да излъчва
            <strong>форма</strong>, <strong>цвят</strong> или <strong>булева
            стойност</strong> (1 или 0).
    reward_logic_gates:
        title: Логически врати
        desc: Отключихте <strong>логически врати</strong>! Не е нужно да се вълнувате,
            но всъщност е супер яко!<br><br> С логическите врати вече можете да
            изчислявате AND, OR, XOR и NOT операции.<br><br> Като бонус ви дадох
            и <strong>транзистор</strong>!
    reward_virtual_processing:
        title: Виртуална обработка
        desc: Току-що ви дадох цял куп нови сгради, които позволяват да
            <strong>симулирате обработката на форми</strong>!<br><br> Вече
            можете да симулирате резачка, ротатор, стакер и още на слоя с
            проводници! Така имате три варианта да продължите играта:<br><br> -
            Постройте <strong>автоматизирана машина</strong>, която създава
            всяка възможна форма, поискана от Централата (препоръчвам да
            пробвате!).<br><br> - Постройте нещо яко с проводници.<br><br> -
            Продължете да играете нормално.<br><br> Каквото и да изберете,
            забавлявайте се!
    no_reward:
        title: Следващо ниво
        desc: "Това ниво не ви даде награда, но следващото ще даде! <br><br> PS:
            По-добре не унищожавайте съществуващата си фабрика - по-късно ще ви
            трябват <strong>всички</strong> тези форми, за да <strong>отключвате
            подобрения</strong>!"
    no_reward_freeplay:
        title: Следващо ниво
        desc: Поздравления!
    reward_freeplay:
        title: Свободна игра
        desc: Успяхте! Отключихте <strong>режима свободна игра</strong>! Това означава,
            че формите вече се генерират <strong>произволно</strong>!<br><br>
            Тъй като Централата вече ще изисква <strong>поток</strong>, силно
            препоръчвам да построите машина, която автоматично доставя исканата
            форма!<br><br> Централата извежда исканата форма на слоя с
            проводници, така че трябва само да я анализирате и автоматично да
            конфигурирате фабриката си според нея.
    reward_demo_end:
        title: Край на демото
        desc: Достигнахте края на демо версията!
    reward_research:
        title: Research
        desc: You have unlocked the <strong>Research</strong> section of the Upgrades
            window! Spend the shapes you deliver to the Hub on optional building
            variants there, instead of waiting for them to show up in the level
            ladder.
    reward_research_t2:
        title: Research Tier II
        desc: <strong>Research Tier II</strong> is now available - more building
            variants can be researched in the Upgrades window!
    reward_shop_auto_tunnel:
        title: Auto-Tunneling
        desc: Purchased in the <strong>Shop</strong> - dragging a belt across a gap now
            automatically tunnels under it!
    reward_shop_overview_building:
        title: Overview Building
        desc: Purchased in the <strong>Shop</strong> - you can now place buildings while
            the map is zoomed out to overview mode!
    reward_shop_auto_merger:
        title: Auto-Merging
        desc: Purchased in the <strong>Shop</strong> - dragging a belt into an existing
            belt run now automatically inserts a merger!
    reward_shop_auto_splitter:
        title: Auto-Splitting
        desc: Purchased in the <strong>Shop</strong> - starting a new belt from an
            existing belt run now automatically inserts a splitter!
    reward_shop_long_route:
        title: Long-Distance Routing
        desc: Purchased in the <strong>Shop</strong> - belts dragged across obstacles
            can now bend around much longer detours!
    reward_shop_exchange:
        title: Exchange
        desc: Purchased in the <strong>Shop</strong> - you can now trade shapes for
            currency and currency for shapes!
mods:
    title: Модове
    author: Автор
    version: Версия
    modWebsite: Уебсайт
    openFolder: Отвори папката с модове
    browseMods: Разгледай модове
    modsInfo: За инсталиране и управление на модове, копирайте ги в папката с модове
        (използвайте бутона 'Отвори папката с модове'). След това рестартирайте
        играта, иначе модовете няма да се покажат.
settings:
    title: Настройки
    categories:
        general: Общи
        userInterface: Потребителски интерфейс
        advanced: Разширени
        performance: Производителност
    versionBadges:
        dev: Разработка
        staging: Тестова
        prod: Продукция
    buildDate: Компилирано на <at-date>
    tickrateHz: <amount> Hz
    rangeSliderPercentage: <amount> %
    newBadge: Ново!
    labels:
        uiScale:
            title: Мащаб на интерфейса
            description: Променя размера на потребителския интерфейс. Интерфейсът все пак ще
                се мащабира според резолюцията на устройството ви, но тази
                настройка контролира степента на мащабиране.
            scales:
                super_small: Много малък
                small: Малък
                regular: Нормален
                large: Голям
                huge: Огромен
        autosaveInterval:
            title: Интервал за автозапазване
            description: Определя колко често играта се запазва автоматично. Можете и
                напълно да го изключите оттук.
            intervals:
                one_minute: 1 минута
                two_minutes: 2 минути
                five_minutes: 5 минути
                ten_minutes: 10 минути
                twenty_minutes: 20 минути
                disabled: Изключено
        scrollWheelSensitivity:
            title: Чувствителност на мащабирането
            description: Променя чувствителността на мащабирането (колелце на мишката или
                тъчпад).
            sensitivity:
                super_slow: Много бавно
                slow: Бавно
                regular: Нормално
                fast: Бързо
                super_fast: Много бързо
        movementSpeed:
            title: Скорост на движение
            description: Променя колко бързо се движи изгледът при използване на
                клавиатурата или при преместване на мишката до краищата на
                екрана.
            speeds:
                super_slow: Много бавно
                slow: Бавно
                regular: Нормално
                fast: Бързо
                super_fast: Много бързо
                extremely_fast: Изключително бързо
        language:
            title: Език
            description: Смени езика. Всички преводи са създадени от потребители и може да
                са непълни!
        enableColorBlindHelper:
            title: Режим за далтонисти
            description: Включва различни инструменти, които ви позволяват да играете, ако
                сте далтонист.
        fullscreen:
            title: Цял екран
            description: Препоръчително е да играете на цял екран за най-добро изживяване.
                Достъпно само в пълната версия.
        soundsMuted:
            title: Заглуши звуците
            description: Ако е включено, заглушава всички звукови ефекти.
        musicMuted:
            title: Заглуши музиката
            description: Ако е включено, заглушава цялата музика.
        soundVolume:
            title: Сила на звука
            description: Задава силата на звуковите ефекти
        musicVolume:
            title: Сила на музиката
            description: Задава силата на музиката
        theme:
            title: Тема на играта
            description: Изберете тема на играта (светла / тъмна).
            themes:
                dark: Тъмна
                light: Светла
        refreshRate:
            title: Tick честота
            description: Определя колко игрови тика се случват в секунда. По-висока честота
                обикновено означава по-добра точност, но и по-слаба
                производителност. При по-ниски честоти потокът може да не е
                точен. Над 60 Hz се очаква забавяне!
        alwaysMultiplace:
            title: Множествено поставяне
            description: Ако е включено, всички сгради остават избрани след поставяне,
                докато не го отмените. Това е еквивалент на постоянно задържан
                SHIFT.
        offerHints:
            title: Подсказки и уроци
            description: Дали да се предлагат подсказки и уроци по време на игра. Също така
                скрива определени UI елементи до дадено ниво, за да е по-лесно
                влизането в играта.
        enableTunnelSmartplace:
            title: Умни тунели
            description: Когато е включено, поставянето на тунели автоматично премахва
                ненужните ленти. Позволява и плъзгане на тунели, като излишните
                се премахват.
        vignette:
            title: Винетка
            description: Включва винетката, която потъмнява ъглите на екрана и прави текста
                по-лесен за четене.
        rotationByBuilding:
            title: Ротация по тип сграда
            description: Всеки тип сграда запомня последно зададената му ротация поотделно.
                Това може да е по-удобно, ако често сменяте различни типове
                сгради.
        compactBuildingInfo:
            title: Компактна информация за сградите
            description: Съкращава информационните полета за сградите, като показва само
                съотношенията им. В противен случай се показват описание и
                изображение.
        disableCutDeleteWarnings:
            title: Изключи предупрежденията за изрязване/изтриване
            description: Изключва предупредителните диалози при изрязване/изтриване на
                повече от 100 обекта.
        lowQualityMapResources:
            title: Нискокачествени ресурси на картата
            description: Опростява изобразяването на ресурсите на картата при увеличение, за
                да подобри производителността. Дори изглежда по-чисто, затова го
                пробвайте!
        disableTileGrid:
            title: Изключи мрежата
            description: Изключването на мрежата от плочки може да помогне за
                производителността. Освен това играта изглежда по-чисто!
        clearCursorOnDeleteWhilePlacing:
            title: Изчисти курсора при десен бутон
            description: Включено по подразбиране, изчиства курсора при десен бутон, докато
                имате избрана сграда за поставяне. Ако е изключено, можете да
                триете сгради с десен бутон, докато поставяте сграда.
        lowQualityTextures:
            title: Нискокачествени текстури (Грозни)
            description: Използва нискокачествени текстури за по-добра производителност.
                Това ще направи играта доста грозна!
        displayChunkBorders:
            title: Показвай границите на чънковете
            description: Играта е разделена на чънкове от 16x16 плочки; ако тази настройка е
                включена, се показват границите на всеки чънк.
        pickMinerOnPatch:
            title: Избирай екстрактор върху ресурсно поле
            description: Включено по подразбиране, избира екстрактора, ако използвате
                пипетата, докато сте върху ресурсно поле.
        simplifiedBelts:
            title: Опростени ленти (Грозни)
            description: Не изобразява предметите върху лентите, освен при посочване, за да
                спести производителност. Не препоръчвам да играете с тази
                настройка, ако не ви е абсолютно необходима.
        enableMousePan:
            title: Преместване по ръба на екрана
            description: Позволява преместване на картата чрез движение на курсора към
                ръбовете на екрана. Скоростта зависи от настройката за скорост
                на движение.
        zoomToCursor:
            title: Мащабиране към курсора
            description: Ако е активирано, мащабирането ще се случва към позицията на
                мишката, иначе към центъра на екрана.
        mapResourcesScale:
            title: Размер на ресурсите на картата
            description: Контролира размера на формите при изглед на картата (при
                отдалечаване).
        shapeTooltipAlwaysOn:
            title: Подсказка за форма - винаги показвай
            description: Дали подсказката за форма винаги да се показва при посочване на
                сгради, вместо да се задържа 'ALT'.
        alwaysShowBuildingInfo:
            title: Always Show Building Info
            description: On mobile (no keyboard/hotkey to toggle it), shows the selected
                building's info panel automatically. Turn off to keep it hidden.
