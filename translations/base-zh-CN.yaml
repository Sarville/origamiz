            class='keybinding'>SHIFT 键</code>： 按住以放置多个同一种设施。<br> <code
            class='keybinding'>ALT 键</code>：反向放置传送带。<br>
    createMarker:
        title: 创建地图标记
        desc: 填写一个有意义的名称，还可以同时包含一个形状的<strong>短代码</strong>（您可以 <link>点击这里</link> 生成短代码）
